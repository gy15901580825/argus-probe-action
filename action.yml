name: "Argus agent red-team scan"
description: "Run Argus red-team probes against your AI agent in CI and upload the findings as SARIF."
author: "gy15901580825"
branding:
  icon: shield
  color: red

inputs:
  target:
    description: "Path to the target spec JSON file."
    required: true
  probes:
    description: "Comma-separated probe ids, or 'all'."
    required: false
    default: "owasp_01_prompt_injection_basic,owasp_07_system_prompt_leakage"
  format:
    description: "Report format: sarif, html, junit or json."
    required: false
    default: "sarif"
  output:
    description: "Path of the report file to write."
    required: false
    default: "argus.sarif"
  fail-on:
    description: "Fail the job when a finding has this severity or higher (info, low, medium, high, critical). Empty string disables the gate."
    required: false
    default: "critical"
  per-run-cap:
    description: "Maximum LLM spend in USD for one scan."
    required: false
    default: "0.50"
  upload-sarif:
    description: "Upload the report to GitHub code scanning. Only used when format is sarif."
    required: false
    default: "true"
  baseline:
    description: "Path to an earlier run.json. Gates only on new failures. From 1.19.0, a missing local file is treated as an empty baseline and prints a note; an invalid file exits 2."
    required: false
    default: ""
  sarif-category:
    description: "Code scanning category. Use a distinct category for each matrix target. Also used in the report artifact name."
    required: false
    default: "argus-probe"
  upload-report:
    description: "Upload the report file as a workflow artifact before applying the gate."
    required: false
    default: "false"
  argus-version:
    description: "argus-probe version to install from PyPI."
    required: false
    default: "1.20.0"
  skip-judged:
    description: "Without a judge key, run only the probes decided by deterministic checks and report the rest as skipped. Without this, a scan that selects judged probes and has no key exits 1."
    required: false
    default: "false"
  install-spec:
    description: "Space-separated pip requirement specs to install instead of argus-probe[local]==<argus-version>."
    required: false
    default: ""
  python-version:
    description: "Python version for actions/setup-python."
    required: false
    default: "3.11"

outputs:
  exit-code:
    description: "Exit code of argus-probe run (0 ok, 1 error or incomplete run, 2 usage error, 3 gate tripped, 4 cost cap)."
    value: ${{ steps.scan.outputs.exit-code }}
  report:
    description: "Path of the report file."
    value: ${{ steps.scan.outputs.report }}
  passed:
    description: "Number of pass verdicts; empty if counts are unavailable."
    value: ${{ steps.summary.outputs.passed }}
  failed:
    description: "Number of fail verdicts, including existing baseline failures."
    value: ${{ steps.summary.outputs.failed }}
  warned:
    description: "Number of warn verdicts."
    value: ${{ steps.summary.outputs.warned }}
  errored:
    description: "Number of error verdicts."
    value: ${{ steps.summary.outputs.errored }}
  skipped:
    description: "Number of skipped verdicts."
    value: ${{ steps.summary.outputs.skipped }}
  blocked-by-target:
    description: "Number of blocked_by_target verdicts."
    value: ${{ steps.summary.outputs.blocked-by-target }}
  aborted-cost:
    description: "Number of aborted_cost verdicts."
    value: ${{ steps.summary.outputs.aborted-cost }}
  total:
    description: "Number of findings across all verdicts; empty if counts are unavailable."
    value: ${{ steps.summary.outputs.total }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install argus-probe
      shell: bash
      env:
        INSTALL_SPEC: ${{ inputs.install-spec }}
        ARGUS_VERSION: ${{ inputs.argus-version }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        if [ -n "$INSTALL_SPEC" ]; then
          read -r -a specs <<< "$INSTALL_SPEC"
          python -m pip install "${specs[@]}"
        else
          python -m pip install "argus-probe[local]==$ARGUS_VERSION"
        fi
        argus-probe --help > /dev/null

    - name: Run argus-probe
      id: scan
      shell: bash
      env:
        ARGUS_TARGET: ${{ inputs.target }}
        ARGUS_PROBES: ${{ inputs.probes }}
        ARGUS_FORMAT: ${{ inputs.format }}
        ARGUS_OUTPUT: ${{ inputs.output }}
        ARGUS_FAIL_ON: ${{ inputs.fail-on }}
        ARGUS_PER_RUN_CAP: ${{ inputs.per-run-cap }}
        ARGUS_SKIP_JUDGED: ${{ inputs.skip-judged }}
        ARGUS_BASELINE: ${{ inputs.baseline }}
      run: |
        set -uo pipefail
        want=""
        out_lc=$(printf '%s' "$ARGUS_OUTPUT" | tr '[:upper:]' '[:lower:]')
        fmt_lc=$(printf '%s' "$ARGUS_FORMAT" | tr '[:upper:]' '[:lower:]')
        case "$fmt_lc" in
          sarif) [[ "$out_lc" == *.sarif ]] || want=".sarif" ;;
          html) [[ "$out_lc" == *.html || "$out_lc" == *.htm ]] || want=".html" ;;
          junit) [[ "$out_lc" == *.xml ]] || want=".xml" ;;
          json) [[ "$out_lc" == *.json ]] || want=".json" ;;
        esac
        if [ -n "$want" ]; then
          echo "::warning::output $ARGUS_OUTPUT does not match format $ARGUS_FORMAT; set output to a $want file, for example argus$want"
        fi
        args=(run --local --target "$ARGUS_TARGET" --probes "$ARGUS_PROBES"
              --format "$ARGUS_FORMAT" --out "$ARGUS_OUTPUT")
        if [ -n "$ARGUS_PER_RUN_CAP" ]; then
          args+=(--per-run-cap "$ARGUS_PER_RUN_CAP")
        fi
        if [ -n "$ARGUS_FAIL_ON" ]; then
          args+=(--fail-on "$ARGUS_FAIL_ON")
        fi
        if [ "$ARGUS_SKIP_JUDGED" = "true" ]; then
          args+=(--skip-judged)
        fi
        if [ -n "$ARGUS_BASELINE" ]; then
          args+=(--baseline "$ARGUS_BASELINE")
        fi
        code=0
        argus-probe "${args[@]}" || code=$?
        echo "argus-probe exited with code $code"
        {
          echo "exit-code=$code"
          echo "report=$ARGUS_OUTPUT"
        } >> "$GITHUB_OUTPUT"

    - name: Summarize scan
      id: summary
      if: always()
      shell: bash
      env:
        ARGUS_TARGET: ${{ inputs.target }}
        ARGUS_FORMAT: ${{ inputs.format }}
        ARGUS_OUTPUT: ${{ inputs.output }}
        ARGUS_BASELINE: ${{ inputs.baseline }}
        SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: python "$GITHUB_ACTION_PATH/scripts/summarize.py"

    - name: Upload report artifact
      if: always() && inputs.upload-report == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: argus-report-${{ inputs.sarif-category }}
        path: ${{ inputs.output }}
        if-no-files-found: warn
        include-hidden-files: true

    - name: Check SARIF report
      id: sarif
      if: always()
      shell: bash
      env:
        UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        ARGUS_FORMAT: ${{ inputs.format }}
        ARGUS_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        upload=false
        if [ "$UPLOAD_SARIF" = "true" ] && [ "$ARGUS_FORMAT" = "sarif" ]; then
          if [ -f "$ARGUS_OUTPUT" ]; then
            upload=true
          else
            echo "::warning::SARIF upload skipped: $ARGUS_OUTPUT was not written."
          fi
        fi
        echo "upload=$upload" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to code scanning
      if: always() && steps.sarif.outputs.upload == 'true'
      uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
      with:
        sarif_file: ${{ inputs.output }}
        category: ${{ inputs.sarif-category }}

    - name: Apply fail-on gate
      if: always()
      shell: bash
      env:
        SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        ARGUS_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        if [ -z "$SCAN_EXIT_CODE" ]; then
          echo "::error::argus-probe did not run; see the earlier steps."
          exit 1
        fi
        case "$SCAN_EXIT_CODE" in
          0)
            echo "Argus scan passed."
            ;;
          3)
            echo "::error::Argus gate tripped: at least one failed probe has severity $ARGUS_FAIL_ON or higher."
            exit 3
            ;;
          *)
            echo "::error::Argus scan error: argus-probe exited with code $SCAN_EXIT_CODE. Check the scan log above."
            exit "$SCAN_EXIT_CODE"
            ;;
        esac
